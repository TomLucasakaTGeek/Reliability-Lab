[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-lab"
version = "0.3.0"
description = "Deterministic AI evaluation infrastructure, built in verifiable milestones"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
reliability-lab = "reliability_lab.cli:main"

[tool.setuptools.package-data]
reliability_lab = ["report_template.html", "live_template.html", "data/*.jsonl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
